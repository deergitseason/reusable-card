save_card:
  name: Save Card
  description: Save a reusable card configuration with the given hash
  fields:
    hash:
      name: Card Hash
      description: Unique identifier for the card (e.g., #camera)
      required: true
      example: "#camera"
      selector:
        text:
    config:
      name: Card Configuration
      description: The complete card configuration object
      required: true
      example: '{"type": "entities", "entities": ["light.living_room"]}'
      selector:
        object:

delete_card:
  name: Delete Card
  description: Delete a reusable card by hash
  fields:
    hash:
      name: Card Hash
      description: Unique identifier for the card to delete
      required: true
      example: "#camera"
      selector:
        text:

cleanup_orphaned:
  name: Cleanup Orphaned Templates
  description: Find and optionally delete template hashes that don't have parent cards in your Lovelace config. Automatically scans across all dashboard views.
  fields:
    view:
      name: View Name
      description: Only check templates for a specific view (optional, defaults to all views)
      required: false
      example: "dashboard"
      selector:
        text:
    dry_run:
      name: Dry Run
      description: If true, only logs what would be deleted without actually deleting (recommended to run first)
      required: false
      default: true
      selector:
        boolean: